name: App Store Connect eşitle

on:
  schedule:
    - cron: "17 */6 * * *"   # 6 saatte bir
  workflow_dispatch: {}       # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

concurrency:
  group: appstore-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bilgileri çek
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node scripts/appstore-sync.mjs fikirler/appstore.json
      - name: Değiştiyse kaydet
        run: |
          if git diff --quiet -- fikirler/appstore.json && git ls-files --error-unmatch fikirler/appstore.json >/dev/null 2>&1; then
            echo "Değişiklik yok"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add fikirler/appstore.json
          git commit -m "App Store Connect bilgileri güncellendi"
          git push
