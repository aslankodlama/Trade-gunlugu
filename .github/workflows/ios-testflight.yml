name: iPhone uygulaması → TestFlight

# Fikirler web uygulamasını Capacitor ile iPhone uygulamasına çevirir, imzalar ve TestFlight'a yükler.
# Gerekli (Settings → Secrets and variables → Actions):
#   Secrets:   ASC_ISSUER_ID, ASC_KEY_ID, ASC_PRIVATE_KEY   (App Store Connect API anahtarı)
#   Variables: IOS_TEAM_ID   (developer.apple.com → Membership → Team ID)
#              IOS_BUNDLE_ID (isteğe bağlı; varsayılan com.aslankodlama.fikirler)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "fikirler/**"
      - "!fikirler/appstore.json"
      - "ios-app/**"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.aslankodlama.fikirler' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Ayarları kontrol et
        run: |
          if [ -z "$TEAM_ID" ]; then
            echo "::error::IOS_TEAM_ID değişkeni yok. Settings → Secrets and variables → Actions → Variables sekmesine Team ID'ni ekle."; exit 1
          fi
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY gizli değerleri eksik."; exit 1
          fi
          echo "Bundle ID: $BUNDLE_ID · Build: $BUILD_NUMBER"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web dosyalarını hazırla
        working-directory: ios-app
        run: |
          npm ci --no-audit --no-fund
          node prepare-www.mjs
          npx cap copy ios

      - name: Takım ve Bundle ID'yi projeye yaz
        working-directory: ios-app/ios/App
        run: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.aslankodlama.fikirler;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = $TEAM_ID;/g" App.xcodeproj/project.pbxproj

      - name: API anahtarını yaz
        run: node scripts/write-p8.mjs "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Derle ve imzala (archive)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="1.0" \
            archive | tail -n 60
          test -d "$RUNNER_TEMP/App.xcarchive" || { echo "::error::Archive oluşmadı. Yukarıdaki hata satırlarına bak."; exit 1; }

      - name: TestFlight'a yükle
        working-directory: ios-app/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "✅ Build $BUILD_NUMBER yüklendi. App Store Connect'te işlenmesi 5–15 dk sürer, sonra TestFlight'ta görünür."

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
