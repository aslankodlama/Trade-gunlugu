<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fikirler</title>
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fikirler">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --fg:#14201b; --muted:#5d6b65; --line:#d5dcd8;
  --accent:#1f6f5c; --accent-fg:#ffffff;
  --up:#178a4c; --up-bg:#dff3e7; --down:#c8323a; --down-bg:#fbe1e2; --warn:#a86400; --warn-bg:#fdf0d8;
  --shadow:0 1px 2px rgb(20 32 27 / .06),0 4px 14px rgb(20 32 27 / .06);
  --display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --sunk:#1c2622; --fg:#e4ece8; --muted:#8c9a94; --line:#26332e;
  --accent:#4cc3a2; --accent-fg:#06221a;
  --up:#3fcf83; --up-bg:#123323; --down:#ff6b72; --down-bg:#3a161a; --warn:#f2b552; --warn-bg:#3a2a10;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --sunk:#1c2622; --fg:#e4ece8; --muted:#8c9a94; --line:#26332e;
  --accent:#4cc3a2; --accent-fg:#06221a;
  --up:#3fcf83; --up-bg:#123323; --down:#ff6b72; --down-bg:#3a161a; --warn:#f2b552; --warn-bg:#3a2a10;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 130px;display:grid;gap:16px}
#view{display:grid;gap:16px;min-width:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:1.6rem;margin:0;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
h2{font-size:1.02rem;margin:0}
.lead{color:var(--muted);margin:2px 0 0;line-height:1.45}
.small{font-size:.75rem;color:var(--muted);line-height:1.5}
.lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--fg);min-height:40px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.ghost:hover{border-color:var(--accent)}
.danger{color:var(--down)}
.sec{display:grid;gap:8px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sechead h2 small{font-weight:400;color:var(--muted);font-family:var(--mono);font-size:.8rem;margin-left:4px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.8rem;padding:4px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;line-height:1.5;font-size:.85rem}

/* Üst çubuk */
.top{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-inline:-16px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.top .ttl .ic{--s:28px}
.iconbtn{background:none;border:0;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn:hover{background:var(--sunk)}
.iconbtn[hidden]{display:none}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;padding:11px 0;outline:none}
.search svg{color:var(--muted)}

/* İkon */
.ic{--s:48px;--h:160;position:relative;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.225);flex:none;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(140deg,hsl(var(--h) 55% 52%),hsl(calc(var(--h) + 40) 60% 38%));color:#fff;font-weight:700;font-size:calc(var(--s)*.42);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08)}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface)}

/* Uygulama ızgarası */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;box-shadow:var(--shadow);min-width:0;position:relative}
.acard:hover{border-color:var(--accent)}
.acard .nm{font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .sub{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.acard .wh{grid-column:1/-1;font-size:.8rem;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.acard .cnt{position:absolute;top:10px;right:10px;min-width:22px;height:22px;border-radius:99px;background:var(--sunk);font-size:.7rem;font-family:var(--mono);display:grid;place-items:center;padding:0 6px;color:var(--muted)}
.acard .cnt.r{background:var(--down);color:#fff}

/* Uygulama sayfası başlığı */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hero .ic{--s:76px}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.subtabs{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:7;display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:1 0 auto;background:none;border:0;border-radius:9px;padding:8px 12px;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.subtabs small{font-family:var(--mono);font-weight:400;opacity:.8;margin-left:3px}

/* Liste öğeleri */
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.item .body{flex:1;min-width:0;display:grid;gap:4px}
.item .t{overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.45}
.item .t.b{font-weight:600}
.item .n{color:var(--muted);font-size:.85rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
.item .acts{display:flex;gap:6px;flex:none;align-items:center}
.item.late{border-color:color-mix(in srgb,var(--down) 45%,transparent);background:var(--down-bg)}
.item.soon{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-bg)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item.tap{cursor:pointer}
.item.tap:hover{border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;background:var(--bg);white-space:nowrap}
.chip.r{color:var(--down);border-color:color-mix(in srgb,var(--down) 40%,transparent)}
.chip.w{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip.g{color:var(--up);border-color:color-mix(in srgb,var(--up) 40%,transparent)}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0;margin-top:1px;color:var(--accent-fg)}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3}
.mini{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.78rem;color:var(--muted);min-height:32px;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.mini:hover{border-color:var(--accent);color:var(--fg)}
.mini.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.more{background:none;border:0;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.more:hover{background:var(--sunk);color:var(--fg)}
.where{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;display:grid;gap:6px;cursor:pointer;text-align:left;width:100%}
.where:hover{border-color:var(--accent)}
.where p{margin:0;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kv div{display:grid;gap:3px;min-width:0;align-content:start}
.kv b{font-size:.95rem;overflow-wrap:anywhere}
.notes{white-space:pre-wrap;color:var(--muted);font-size:.85rem;line-height:1.5;border-top:1px solid var(--line);padding-top:8px;overflow-wrap:anywhere}
.daygrp{display:grid;gap:6px}
.daygrp>.lbl{padding-left:2px;margin-top:6px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:.8rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.notice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:.85rem}
.notice span{flex:1;min-width:180px}
details.help{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.85rem;line-height:1.55}
details.help summary{cursor:pointer;font-weight:600}
details.help ol{padding-left:20px;margin:8px 0 0}
details.help code{font-family:var(--mono);font-size:.8rem;background:var(--sunk);padding:1px 5px;border-radius:5px}

/* Ekle düğmesi */
.fab{position:fixed;right:max(16px,calc(50vw - 414px));bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:9;height:56px;min-width:56px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:24px;height:24px}
@media (min-width:861px){.fab{bottom:96px}}

/* Diyaloglar */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
dialog form{display:grid;gap:12px;padding:18px}
@media (max-width:600px){
  dialog.sheet{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:20px 20px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.field{display:grid;gap:4px;min-width:0}
.field>label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.cb{display:flex;gap:8px;align-items:center;font-size:.9rem;padding-top:22px}
textarea{resize:vertical;min-height:84px;line-height:1.45}
.formacts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.formacts .left{margin-right:auto}
.iconpick{display:flex;gap:12px;align-items:center}
.iconpick .ic{--s:56px}
/* Eylem listesi (ekle menüsü, ☰ menü) */
.acts-list{display:grid;gap:4px;padding:10px}
.acts-list h3{margin:6px 10px 4px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.acts-list button,.acts-list a{display:flex;align-items:center;gap:14px;background:none;border:0;border-radius:12px;padding:12px;text-align:left;color:var(--fg);text-decoration:none;font-size:.95rem;min-height:52px}
.acts-list button:hover,.acts-list a:hover{background:var(--sunk)}
.acts-list .ai{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--sunk);color:var(--accent);flex:none}
.acts-list .ai svg{width:20px;height:20px}
.acts-list b{display:block;font-weight:600}
.acts-list span.d{display:block;font-size:.78rem;color:var(--muted);margin-top:1px}
.acts-list hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
.acts-list .ic{--s:38px;font-size:15px}
.themes{display:flex;gap:6px;padding:4px 12px 8px}
.themes button{flex:1;justify-content:center;min-height:40px;padding:8px;border:1px solid var(--line);font-size:.85rem}
.themes button[aria-pressed="true"]{border-color:var(--accent);background:var(--sunk);font-weight:600}

/* Alt sekmeler */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{position:relative;background:none;border:0;display:grid;justify-items:center;gap:3px;padding:6px 0;border-radius:12px;font-size:.7rem;font-weight:600;color:var(--muted);min-height:54px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--sunk)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:99px;background:var(--down);color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
@media (min-width:861px){.tabs{max-width:860px;margin:0 auto;bottom:12px;border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow)}}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.85rem;z-index:20;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .25)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top">
    <button class="iconbtn" id="btnBack" aria-label="Geri" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl" id="ttl">Fikirler</div>
    <button class="iconbtn" id="btnSearch" aria-label="Ara"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="iconbtn" id="btnMenu" aria-label="Menü"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <main id="view"></main>
</div>

<button class="fab" id="fab"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="fabTxt">Ekle</span></button>

<nav class="tabs" id="tabs" aria-label="Ana menü">
  <button data-tab="apps"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Uygulamalar</button>
  <button data-tab="ideas"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Fikirler</button>
  <button data-tab="plans"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>Planlar</button>
</nav>

<dialog id="dlg"><form id="form" method="dialog"></form></dialog>
<dialog id="sheet" class="sheet"><div class="acts-list" id="sheetBody"></div></dialog>

<script>
/* ================= yardımcılar ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DAY=864e5;
const AY=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const AYU=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNU=["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey(new Date());
const parseDue=s=>s?new Date(s.length===10?s+"T09:00":s):null;
const startOfDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const daysBetween=(a,b)=>Math.round((startOfDay(b)-startOfDay(a))/DAY);
function niceDate(s){
  if(!s)return "";
  const d=parseDue(s), diff=daysBetween(new Date(),d);
  const time=s.length>10?` ${pad(d.getHours())}:${pad(d.getMinutes())}`:"";
  const label=diff===0?"Bugün":diff===1?"Yarın":diff===-1?"Dün":`${d.getDate()} ${AY[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""} ${GUNU[d.getDay()]}`;
  return label+time;
}
const longDay=s=>{const d=parseDue(s);return `${d.getDate()} ${AYU[d.getMonth()]} ${d.getFullYear()}`};
const isoDay=iso=>iso?dkey(new Date(iso)):"";
const norm=s=>String(s||"").toLocaleLowerCase("tr");
const I={ // simgeler
  check:`<path d="M5 12l5 5 9-10"/>`, search:`<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>`, plus:`<path d="M12 5v14M5 12h14"/>`, dots:`<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>`,
  done:`<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>`, todo:`<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>`,
  idea:`<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>`,
  pin:`<path d="M12 21s-6-5.4-6-11a6 6 0 0 1 12 0c0 5.6-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>`,

/* ---------- durum hesapları ---------- */
function dueState(due,done){
  if(done)return "done";
  const d=parseDue(due); if(!d)return "none";
  const now=new Date();
  if(daysBetween(now,d)<0||(due.length>10&&d<now))return "late";
  if(daysBetween(now,d)===0)return "today";
  if(d-now<2*DAY)return "soon";
  return "later";
}
const planState=p=>dueState(p.due,p.done);
function advance(due,rep){
  const d=parseDue(due), hasTime=due.length>10, now=new Date();
  do{ if(rep==="daily")d.setDate(d.getDate()+1); else if(rep==="weekly")d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1); }while(daysBetween(now,d)<0);
  return hasTime?`${dkey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`:dkey(d);
}
function appNext(a){if(!+a.every)return null;const d=new Date((a.last||today())+"T09:00");d.setDate(d.getDate()+(+a.every));return d}
function appState(a){const n=appNext(a);if(!n)return "off";const left=daysBetween(new Date(),n);return left<0?"late":left===0?"today":left<=3?"soon":"ok"}
const appTodos=a=>a.items.filter(i=>i.kind==="todo"&&!i.done).sort((p,q)=>(q.must?1:0)-(p.must?1:0)||(p.date||"9").localeCompare(q.date||"9"));
const appDone=a=>a.items.filter(i=>i.kind==="done"||(i.kind==="todo"&&i.done)).sort((p,q)=>(q.doneDate||q.date||"").localeCompare(p.doneDate||p.date||""));
const appIdeas=a=>db.ideas.filter(i=>i.appId===a.id&&i.status!=="bitti").sort((p,q)=>(q.date||"").localeCompare(p.date||""));
const appLateCount=a=>appTodos(a).filter(t=>dueState(t.date,false)==="late").length+(["late","today"].includes(appState(a))?1:0);

/* ---------- ikon ---------- */
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function iconHtml(a,size){
  const src=a.icon||a.ascIcon, letter=(a.name||"?").trim().charAt(0).toLocaleUpperCase("tr");
  return `<span class="ic" style="--h:${hue(a.name)}${size?`;--s:${size}px`:""}" aria-hidden="true">${esc(letter)}${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`:""}</span>`;
}
// Seçilen resmi 256px kareye küçültüp cihazda sakla
function pickIcon(cb){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const img=new Image();img.onload=()=>{
    const S=256,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d");
    const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
    URL.revokeObjectURL(img.src);cb(c.toDataURL("image/jpeg",.85));};img.onerror=()=>toast("Resim açılamadı");img.src=URL.createObjectURL(f)};
  inp.click();
}

/* ================= App Store Connect ================= */
let ASC=null;
async function loadAsc(){
  try{
    const r=await fetch("appstore.json",{cache:"no-store"}); if(!r.ok)return;
    ASC=await r.json(); if(!Array.isArray(ASC.apps)){ASC=null;return}
    if(syncAsc())save();
    if(!anyOpen())render();
  }catch{}
}
const ascFor=a=>ASC&&a.ascId?ASC.apps.find(x=>x.id===a.ascId):null;
function syncAsc(){
  let changed=false;
  for(const x of ASC.apps){
    let a=db.apps.find(y=>y.ascId===x.id)||db.apps.find(y=>!y.ascId&&norm(y.name.trim())===norm(x.name.trim()));
    if(!a)continue;
    if(a.ascId!==x.id){a.ascId=x.id;changed=true}
    changed=mergeAsc(a,x)||changed;
  }
  return changed;
}
function mergeAsc(a,x){
  let ch=false;
  if(x.icon&&a.ascIcon!==x.icon){a.ascIcon=x.icon;ch=true}
  const liveV=x.live?.version||x.versions.find(v=>v.state==="READY_FOR_SALE"||v.state==="READY_FOR_DISTRIBUTION")?.version;
  if(liveV&&a.version!==liveV){a.version=liveV;ch=true}
  if(!a.version&&x.versions[0]){a.version=x.versions[0].version;ch=true}
  const relDay=isoDay(x.live?.releaseDate);
  if(relDay&&(!a.last||relDay>a.last)){a.last=relDay;a.history.push({date:relDay,version:liveV||"",note:"App Store'da yayınlandı",src:"asc"});ch=true}
  for(const v of x.versions){
    if(!RELEASED.has(v.state)||a.imported[v.id])continue;
    const notes=(v.version===x.live?.version&&x.live?.notes)||v.whatsNew;
    const date=(v.version===x.live?.version&&relDay)||isoDay(v.created);
    a.items.push({id:uid(),kind:"done",text:notes||`${v.version} sürümü yayınlandı`,version:v.version,date,src:"asc"});
    a.imported[v.id]=1;ch=true;
  }
  return ch;
}
function importAllAsc(){
  let n=0;
  for(const x of ASC.apps){
    if(db.apps.some(y=>y.ascId===x.id))continue;
    const a={id:uid(),name:x.name,version:"",url:x.live?.url||"",every:0,last:"",ascId:x.id,items:[],history:[],imported:{},where:{text:"",date:""}};
    mergeAsc(a,x);db.apps.push(a);n++;
  }
  save();render();toast(n?`${n} uygulama eklendi`:"Hepsi zaten ekli");
}

function itemForm(a,it,kind,preset){

  openForm(`<h2>${it?"Düzenle":isTodo?"Eklemem gereken":"Yaptım / ekledim"}</h2>
    <div class="field"><label for="f-t">${isTodo&&!x.done?"Ne eklenecek?":"Ne yaptın?"}</label><textarea id="f-t" required placeholder="${isTodo?"Ör: Karanlık mod":"Ör: Giriş ekranını yeniledim"}">${esc(x.text)}</textarea></div>
    <div class="fields">
      <div class="field"><label for="f-k">Tür</label><select id="f-k"><option value="todo"${isTodo&&!x.done?" selected":""}>Eklemem gerekiyor</option><option value="done"${!isTodo||x.done?" selected":""}>Yaptım / ekledim</option></select></div>
      <div class="field"><label for="f-v">Sürüm (isteğe bağlı)</label><input id="f-v" maxlength="20" value="${esc(x.version)}" placeholder="${esc(a.version||"1.0")}"></div>

    </div>`,
  ()=>{
    const text=$("f-t").value.trim(); if(!text)return false;
    const k=$("f-k").value, date=$("f-d").value;
    const v={text,version:$("f-v").value.trim(),must:$("f-m").checked};
    if(k==="todo")Object.assign(v,{kind:"todo",date,done:false,doneDate:null});
    else if(x.kind==="todo")Object.assign(v,{kind:"todo",done:true,doneDate:date||today()});
    else Object.assign(v,{kind:"done",date:date||today()});
    if(it)Object.assign(it,v);
    else{a.items.push({id:uid(),...v,ideaId:x.ideaId||null});
      const idea=x.ideaId&&db.ideas.find(i=>i.id===x.ideaId); if(idea){idea.status=k==="todo"?"plan":"bitti";idea.updated=Date.now()}}
    save();toast("Kaydedildi");
  }, it&&(()=>{a.items=a.items.filter(y=>y!==it);save()}));

  $("f-k").onchange=sync;sync();

function updateForm(a){

    <div class="field"><label for="f-d">Tarih</label><input id="f-d" type="date" value="${today()}"></div></div>
    <div class="field"><label for="f-n">Ne değişti? (Yaptıklarıma da eklenir)</label><textarea id="f-n" placeholder="Yeni özellikler, düzeltmeler…"></textarea></div>`,
  ()=>{
    const v=$("f-v").value.trim(),d=$("f-d").value||today(),n=$("f-n").value.trim();

      <div class="body"><div class="t b">${esc(p.title)}</div>${p.note?`<div class="n">${esc(p.note)}</div>`:""}
        <div class="meta">${p.due?`<span class="chip${st==="late"?" r":st==="today"?" w":""}">${st==="late"?"Gecikti · ":""}${esc(niceDate(p.due))}</span>`:""}${p.repeat!=="none"?`<span class="chip">↻ ${REPEAT[p.repeat]}</span>`:""}${p.pri==3?`<span class="chip r">Önemli</span>`:""}${p.done?`<span>${esc(niceDate(p.doneDate))} bitti</span>`:""}</div></div>
      <div class="acts">${p.due&&!p.done?`<button class="mini" data-ics="${p.id}" title="Telefon takvimine alarmlı ekle">Takvime</button>`:""}<button class="more" data-edit="${p.id}" aria-label="Düzenle">${svg("dots")}</button></div>
    </div>`}).join(""):`<div class="empty">${db.plans.length?"Bu filtrede plan yok.":"Henüz plan yok. Sağ alttaki <b>+ Plan</b> ile ekle."}</div>`}</div>
  <p class="small">İpucu: Uygulama kapalıyken de hatırlatma istiyorsan “Takvime” ile planı telefon takvimine alarmlı ekle.</p>`;
  on("[data-f]",b=>{filter.plans=b.dataset.f;render()});
  on("[data-edit]",b=>planForm(db.plans.find(p=>p.id===b.dataset.edit)));
  on("[data-ics]",b=>icsFor(db.plans.find(p=>p.id===b.dataset.ics)));
  on("[data-done]",b=>togglePlan(db.plans.find(p=>p.id===b.dataset.done)));
}
function togglePlan(p){
  if(p.done){p.done=false;p.doneDate=null;save();render();return}
  if(p.repeat!=="none"&&p.due){p.due=advance(p.due,p.repeat);p.count=(p.count||0)+1;toast(`Tamamlandı. Sıradaki: ${niceDate(p.due)}`)}
  else{p.done=true;p.doneDate=today();toast("Tamamlandı ✔")}
  save();render();
}
function planForm(p,preset){
  const x=p||Object.assign({title:"",note:"",due:"",repeat:"none",pri:2},preset);
  const date=x.due?x.due.slice(0,10):"", time=x.due&&x.due.length>10?x.due.slice(11,16):"";
  openForm(`<h2>${p?"Planı düzenle":"Yeni plan"}</h2>
    <div class="field"><label for="f-t">Ne yapacaksın?</label><input id="f-t" required maxlength="200" value="${esc(x.title)}"></div>
    <div class="field"><label for="f-n">Not</label><textarea id="f-n">${esc(x.note)}</textarea></div>
    <div class="fields"><div class="field"><label for="f-d">Tarih</label><input id="f-d" type="date" value="${date||(p?"":today())}"></div>
    <div class="field"><label for="f-h">Saat (isteğe bağlı)</label><input id="f-h" type="time" value="${time}"></div>
    <div class="field"><label for="f-r">Tekrar</label><select id="f-r">${Object.entries(REPEAT).map(([k,l])=>`<option value="${k}"${x.repeat===k?" selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label for="f-p">Önem</label><select id="f-p">${Object.entries(PRI).map(([k,l])=>`<option value="${k}"${x.pri==k?" selected":""}>${l}</option>`).join("")}</select></div>
    ${p?.done?`<div class="field"><label for="f-dd">Bitirdiğin tarih</label><input id="f-dd" type="date" value="${esc(p.doneDate||"")}"></div>`:""}</div>`,
  ()=>{
    const d=$("f-d").value,h=$("f-h").value;
    const v={title:$("f-t").value.trim(),note:$("f-n").value.trim(),due:d?(h?`${d}T${h}`:d):"",repeat:$("f-r").value,pri:+$("f-p").value};
    if(!v.title)return false;
    if(v.repeat!=="none"&&!v.due){toast("Tekrarlayan plan için tarih seç");return false}
    if($("f-dd"))v.doneDate=$("f-dd").value||p.doneDate;
    if(p)Object.assign(p,v);
    else{
      db.plans.push({id:uid(),...v,done:false,created:Date.now(),ideaId:x.ideaId||null});
      const idea=x.ideaId&&db.ideas.find(i=>i.id===x.ideaId);
      if(idea&&idea.status==="yeni"){idea.status="plan";idea.updated=Date.now()}
    }
    save();toast("Plan kaydedildi");
    if(preset?.ideaId){filter.plans="aktif";go("plans")}
  }, p&&(()=>{db.plans=db.plans.filter(y=>y!==p);save()}));
}

/* ================= ortak form ================= */
function openForm(html,onSave,onDelete){
  const dlg=$("dlg"),form=$("form");
  if($("sheet").open)$("sheet").close();
  form.innerHTML=html+`<div class="formacts">${onDelete?`<button type="button" class="ghost danger left" id="f-del">${svg("trash")} Sil</button>`:""}<button type="button" class="ghost" id="f-x">Vazgeç</button><button class="btn" id="f-ok">Kaydet</button></div>`;
  form.onsubmit=e=>{e.preventDefault();if(onSave()===false)return;dlg.close();render()};
  $("f-x").onclick=()=>dlg.close();
  if(onDelete)$("f-del").onclick=()=>{if(confirm("Silinsin mi? Bu geri alınamaz.")){onDelete();dlg.close();render();toast("Silindi")}};
  if(!dlg.open)dlg.showModal();
  setTimeout(()=>form.querySelector("input:not([type=date]):not([type=time]):not([type=checkbox]),textarea")?.focus(),30);
}

/* ================= hatırlatma ================= */
async function askNotify(){
  if(!("Notification" in window)){toast("Bu tarayıcı bildirim desteklemiyor");return}
  const r=await Notification.requestPermission();
  toast(r==="granted"?"Bildirimler açık":"Bildirim izni verilmedi");render();
}
async function notify(title,body,tag){
  toast(`${title}: ${body}`);
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  try{const reg=await navigator.serviceWorker?.getRegistration();
    if(reg)reg.showNotification(title,{body,tag,icon:"../icon-192-v2.png",badge:"../icon-192-v2.png"});
    else new Notification(title,{body,tag,icon:"../icon-192-v2.png"});
  }catch{try{new Notification(title,{body,tag})}catch{}}
}
function checkReminders(){
  const now=new Date(); let changed=false;
  const fire=(k,title,body)=>{if(db.notified[k])return;db.notified[k]=1;changed=true;notify(title,body,k)};
  for(const p of db.plans)if(!p.done&&p.due&&parseDue(p.due)<=now)fire("p:"+p.id+":"+p.due,"Plan zamanı",p.title);
  for(const a of db.apps){
    if(["late","today"].includes(appState(a)))fire("a:"+a.id+":"+a.last+":"+today(),"Güncelleme zamanı",`${a.name} güncellenmeyi bekliyor`);
    for(const t of appTodos(a))if(t.date&&parseDue(t.date)<=now)fire("t:"+t.id+":"+t.date,a.name,t.text.split("\n")[0]);
  }
  if(changed){
    const keys=Object.keys(db.notified); if(keys.length>500)keys.slice(0,keys.length-500).forEach(k=>delete db.notified[k]);
    save(); if(!anyOpen())render();
  }
}
setInterval(checkReminders,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkReminders();loadAsc();if(!anyOpen())render()}});

/* Takvim dosyası (.ics) */
function icsFor(p){
  const d=parseDue(p.due), allDay=p.due.length===10;
  const f=x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}`;
  const ft=x=>f(x)+`T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const e=s=>String(s).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  const end=new Date(d.getTime()+(allDay?DAY:30*60e3));
  const rr={daily:"DAILY",weekly:"WEEKLY",monthly:"MONTHLY"}[p.repeat];
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Fikirler//TR","BEGIN:VEVENT",
    `UID:${p.id}@fikirler`,`DTSTAMP:${ft(new Date())}`,
    allDay?`DTSTART;VALUE=DATE:${f(d)}`:`DTSTART:${ft(d)}`, allDay?`DTEND;VALUE=DATE:${f(end)}`:`DTEND:${ft(end)}`,
    `SUMMARY:${e(p.title)}`, p.note?`DESCRIPTION:${e(p.note)}`:"", rr?`RRULE:FREQ=${rr}`:"",
    "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${e(p.title)}`, allDay?"TRIGGER:PT9H":"TRIGGER:-PT10M","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].filter(Boolean);
  download(new Blob([lines.join("\r\n")],{type:"text/calendar"}),"plan.ics");
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function exportData(){download(new Blob([JSON.stringify(db,null,1)],{type:"application/json"}),`fikirler-yedek-${today()}.json`)}
function importData(){
  const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
  inp.onchange=async()=>{try{const d=JSON.parse(await inp.files[0].text());if(!Array.isArray(d.ideas)||!Array.isArray(d.plans))throw 0;
    if(!confirm("Mevcut verilerin yedekle değiştirilsin mi?"))return;localStorage.setItem(LS,JSON.stringify(d));location.reload()}catch{toast("Bu dosya geçerli bir yedek değil")}};
  inp.click();
}

render();
checkReminders();
loadAsc();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
